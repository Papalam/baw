{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="color-scheme" content="light only">
    <link rel="stylesheet" href="{% static 'css/swiper-bundle.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/fancybox.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.min.css' %}">
{#    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">#}
    <title>{% block title %}BAW{% endblock %}</title>
</head>

<body class="m-page">
    <div class="wrapper">
        {% include 'header.html' %}

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}"
                         style="padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; {% if message.tags == 'success' %}color: #3c763d; background-color: #dff0d8; border-color: #d6e9c6;{% else %}color: #a94442; background-color: #f2dede; border-color: #ebccd1;{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <main class="content">
            {% block content %}Контент{% endblock %}
        </main>
        {% include 'footer.html' %}
    </div>

    <div class="modal" id="Modal">
        <div class="modal__bg modal-bg _close-modal"></div>
        <div class="modal__dialog">
            <div class="modal__top">
                <div class="text32 medium-text">
                    Title
                </div>
                <button class="close-btn _close-modal">
                    <img src="{% static 'img/close.svg' %}" alt="Кнопка свернуть меню" />
                </button>
            </div>
        </div>
    </div>


    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'js/fancybox.umd.js' %}"></script>
    <script src="{% static 'js/main.min.js' %}?v=1.2"></script>
</body>
</html>
