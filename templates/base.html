{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="color-scheme" content="light only">
    <link rel="stylesheet" href={% static 'css/swiper-bundle.min.css' %}>
    <link rel="stylesheet" href={% static 'css/fancybox.css' %}>
    <link rel="stylesheet" href={% static 'css/style.min.css' %}>
{#    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">#}
    <title>{% block title %}BAW{% endblock %}</title>
</head>

<body class="m-page">
    <div class="wrapper">
        {% include 'header.html' %}
        <main class="content">
            {% block content %}Контент{% endblock %}
        </main>
        {% include 'footer.html' %}
    </div>

    <div class="modal" id="Modal">
        <div class="modal__bg modal-bg _close-modal"></div>
        <div class="modal__dialog">
            <div class="modal__top">
                <div class="text32 medium-text">
                    Title
                </div>
                <button class="close-btn _close-modal">
                    <img src="{% static 'img/close.svg' %}" alt="Кнопка свернуть меню" />
                </button>
            </div>
        </div>
    </div>


    <script src="{% static 'js/jquery.min.js' %}"></script>
    <script src="{% static 'js/swiper-bundle.min.js' %}"></script>
    <script src="{% static 'js/fancybox.umd.js' %}"></script>
    <script src="{% static 'js/main.min.js' %}"></script>
</body>
</html>
