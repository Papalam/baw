{% load static %}

<div class="other-news">
    <div class="container">
        <div class="h1">
            Другие новости
        </div>
        <div class="events-slider2 slider _pag-num">
            <div class="slider__wrap">
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        {% for other_new in other_news %}
                            <div class="swiper-slide">
                                <div class="event-card event-card2 grid">
                                    <div class="event-card__col">
                                        <div class="event-card__img">
                                            <img src="{{ other_new.webp_image.url }}" alt="">
                                        </div>
                                    </div>
                                    <div class="event-card__col2">
                                        <div class="event-card__top">
                                            <div class="event-card__date">
                                                {{ other_new.created_at|date:"j E Y" }}
                                            </div>
                                            <div class="event-card__title">
                                                <a href="{% url 'news-detail' other_new.slug %}">
                                                    {{ other_new.title }}
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="slider__nav">
                <div class="swiper-nav">
                    <div class="swiper-button swiper-button-prev">
                        <img src="{% static 'img/prev.svg' %}" alt="">
                    </div>
                    <div class="swiper-button swiper-button-next">
                        <img src="{% static 'img/next.svg' %}" alt="">
                    </div>
                </div>
                <div class="swiper-pagination _black"></div>
            </div>
        </div>
    </div>
</div>
