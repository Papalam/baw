{% load static %}

<div class="journey m-section _tabs-parent">
    <div class="container">
        <div class="h1 text-center">
            НАШИ ПРИКЛЮЧЕНИЯ
        </div>
        <div class="journey__tabs">
            {% for adventure in adventures %}
                <div class="journey__tab m-btn m-btn--cut _tab {% if forloop.first %}_active{% endif %}"
                     data-tab="_tab{{ adventure.id }}">
                    <span>{{ adventure.title }}</span>
                </div>
            {% endfor %}
        </div>
        <div class="journey-slider slider">
            <div class="slider__wrap">
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        {% for adventure in adventures %}
                            <div class="swiper-slide">
                                <div class="tab-content _tab{{ adventure.id }}
                                           {% if forloop.first %}_active{% endif %}">
                                    <div class="journey-card">
                                        <div class="journey__tab m-btn m-btn--cut _active">
                                            <span>{{ adventure.name }}</span>
                                        </div>
                                        <div class="journey-card__top">
                                            <div class="journey-card__title">
                                                {{ adventure.name }}
                                            </div>
                                            <div class="journey-card__desc gray-text">
                                                {{ adventure.description }}
                                            </div>
                                            {% if adventure.ext_url %}
                                            <a href="{{ adventure.ext_url }}" class="journey-card__link">
                                                <span>УЗНАТЬ КАК ЭТО БЫЛО</span>
                                            </a>
                                            {% endif %}
                                        </div>
                                        <div class="journey-card__video">

                                        </div>
                                        <a href="{{ adventure.video.url }}" data-fancybox
                                           class="journey-card__video video-card">
                                            <div class="video-card__img">
                                                <img src="{{ adventure.webp_image.url }}" alt="">
                                            </div>
                                        </a>
                                    </div>

                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="slider__nav">
                <div class="swiper-nav">
                    <div class="swiper-button swiper-button-prev">
                        <img src="{% static 'img/prev.svg' %}" alt="">
                    </div>
                    <div class="swiper-button swiper-button-next">
                        <img src="{% static 'img/next.svg' %}" alt="">
                    </div>
                </div>

                <div class="swiper-pagination _black"></div>
            </div>
        </div>
    </div>

</div>
