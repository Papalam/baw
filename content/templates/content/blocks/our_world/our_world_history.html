{% load static %}

{% if history %}
<div class="stories">
    <div class="container">
        <div class="h1">
            ИСТОРИИ КЛИЕНТОВ
        </div>
        <div class="stories-slider slider">
            <div class="slider__wrap">
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        {% for story in history %}
                        	<div class="swiper-slide">
                            <div class="story-card">
                                <div class="story-card__img">
                                    <img src="{{ story.webp_image.url }}" alt="">
                                </div>
                                <div class="story-card__content">
                                    <div class="story-card__title m-subtitle">
                                        {{ story.title }}
                                    </div>
                                    <div class="story-card__city text16 _lsp01">
                                        {{ story.city }}
                                    </div>
                                    <div class="story-card__desc text16 _lsp01 gray-text">
                                        {{ story.description }}
                                    </div>
                                </div>
                            </div>

                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="slider__nav">
                <div class="swiper-nav">
                    <div class="swiper-button swiper-button-prev">
                        <img src="{% static 'img/prev.svg' %}" alt="">
                    </div>
                    <div class="swiper-button swiper-button-next">
                        <img src="{% static 'img/next.svg' %}" alt="">
                    </div>
                </div>

                <div class="swiper-pagination _black"></div>
            </div>
        </div>
    </div>
</div>
{% endif %}
