{% load static %}

<div class="events-slider2 slider _pag-num">
    <div class="slider__wrap">
        <div class="swiper-container">
            <div class="swiper-wrapper">
                {% for article in news %}
                	<div class="swiper-slide">
                    <div class="event-card event-card2 grid">
                        <div class="event-card__col">
                            <div class="event-card__img">
                                <img src="{{ article.webp_image.url }}" alt="">
                            </div>
                        </div>
                        <div class="event-card__col2">
                            <div class="event-card__top">
                                <div class="event-card__date">
                                   {{ article.created_at|date:"j E Y" }}
                                </div>
                                <div class="event-card__title">
                                    <a href="{% url 'news-detail' article.slug %}">
                                        {{ article.title }}
                                    </a>
                                </div>
                                <div class="event-card__desc">
                                    {{ article.description|truncatewords:20|safe }}
                                </div>
                            </div>
                            <div class="event-card__bottom">
                                <a href="{% url 'news-detail' article.slug %}" class="event-card__link">
                                    Читать полностью
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </div>
    <div class="slider__nav">
        <div class="swiper-nav">
            <div class="swiper-button swiper-button-prev">
                <img src="{% static 'img/prev.svg' %}" alt="">
            </div>
            <div class="swiper-button swiper-button-next">
                <img src="{% static 'img/next.svg' %}" alt="">
            </div>
        </div>

        <div class="swiper-pagination _black"></div>
    </div>
</div>

<div class="events__nav">
    <a href="{% url 'news-list' %}" class="events__link m-btn m-btn-brown m-btn--cut">
        <span>СМОТРЕТЬ ВСЕ</span>
    </a>
</div>
